name: production-calculator

networks:
    shared-network:
        external: true

services:
    backend:
        image: scott2444/production-calculator-backend:${TAG:-latest}
        container_name: backend
        restart: always
        environment:
            - ASPNETCORE_URLS=http://0.0.0.0:5000
        volumes:
            - ./scripts/backend-entrypoint.sh:/backend-entrypoint.sh
        entrypoint: ["/bin/sh", "/backend-entrypoint.sh"]
        secrets:
            - server_password
            - resend_apitoken
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:5000/HealthCheck"]
            interval: 10s
            retries: 5
            start_period: 10s
            timeout: 10s
        networks:
            - shared-network

    # Monitoring and Logging Services
    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        restart: always
        volumes:
            - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=15d"
            - "--storage.tsdb.retention.size=10GB"
        deploy:
            resources:
                limits:
                    memory: 1g
        depends_on:
            - backend
        networks:
            - shared-network

    loki:
        image: grafana/loki:latest
        container_name: loki
        restart: always
        volumes:
            - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml
            - loki_data:/loki
        command: -config.file=/etc/loki/local-config.yaml
        deploy:
            resources:
                limits:
                    memory: 1g
        networks:
            - shared-network

    promtail:
        image: grafana/promtail:latest
        container_name: promtail
        restart: always
        environment:
            - PROJECT_NAME=${COMPOSE_PROJECT_NAME:-production-calculator}
        volumes:
            - /var/lib/docker/containers:/var/lib/docker/containers:ro
            - /var/run/docker.sock:/var/run/docker.sock
            - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml
        command: -config.file=/etc/promtail/config.yml -config.expand-env=true
        depends_on:
            - loki
        networks:
            - shared-network

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        restart: always
        volumes:
            - grafana_data:/var/lib/grafana
            - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
            - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
        depends_on:
            - prometheus
            - loki
        deploy:
            resources:
                limits:
                    memory: 512m
        networks:
            - shared-network

volumes:
    prometheus_data:
    loki_data:
    grafana_data:

secrets:
    server_password:
        file: ./secrets/server_password.txt
    resend_apitoken:
        file: ./secrets/resend_apitoken.txt
