name: Build and Deploy Production Calculator

on:
    push:
        branches: ["**"]

jobs:
    unit-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Run backend unit tests
              run: dotnet test
              working-directory: ./backend

    build:
        needs: unit-test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Extract Docker image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: scott2444/production-calculator-backend
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=long

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: scott2444
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  file: ./backend/Dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  annotations: ${{ steps.meta.outputs.annotations }}
                  provenance: true
                  sbom: true

    deploy_development:
        needs: build
        environment: Development
        runs-on: ubuntu-latest
        steps:
            - name: Remote deployment to Development
              uses: and-fm/cloudflared-ssh-action@v3
              with:
                  host: ${{ secrets.SERVER_SSH_HOST }}
                  port: 22
                  username: ${{ secrets.SERVER_SSH_USERNAME }}
                  private_key_filename: "deploy_key"
                  private_key_value: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
                  service_token_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
                  service_token_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
                  commands: |
                      cd ~/production-calculator
                      git fetch --all
                      git checkout ${{ github.sha }}
                      export TAG=sha-${{ github.sha }}

                      docker network create calculator-dev-network || true

                      if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                          docker compose -f "docker-compose.db.yml" -f "docker-compose.db.dev.yml" pull
                          docker compose -f "docker-compose.db.yml" -f "docker-compose.db.dev.yml" up -d
                      fi

                      docker compose -f "docker-compose.yml" -f "docker-compose.dev.yml" pull
                      docker compose -f "docker-compose.yml" -f "docker-compose.dev.yml" up -d

    deploy_staging:
        if: github.ref == 'refs/heads/main'
        needs: deploy_development
        environment: Staging
        runs-on: ubuntu-latest
        steps:
            - name: Remote deployment to Staging
              uses: and-fm/cloudflared-ssh-action@v3
              with:
                  host: ${{ secrets.SERVER_SSH_HOST }}
                  port: 22
                  username: ${{ secrets.SERVER_SSH_USERNAME }}
                  private_key_filename: "deploy_key"
                  private_key_value: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
                  service_token_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
                  service_token_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
                  commands: |
                      cd ~/production-calculator
                      git fetch --all
                      git checkout ${{ github.sha }}
                      export TAG=sha-${{ github.sha }}

                      docker network create calculator-staging-network || true

                      if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                          docker compose -f "docker-compose.db.yml" -f "docker-compose.db.staging.yml" pull
                          docker compose -f "docker-compose.db.yml" -f "docker-compose.db.staging.yml" up -d
                      fi

                      docker compose -f "docker-compose.yml" -f "docker-compose.staging.yml" pull
                      docker compose -f "docker-compose.yml" -f "docker-compose.staging.yml" up -d

    deploy_production:
        if: github.ref == 'refs/heads/main'
        needs: deploy_staging
        environment: Production
        runs-on: ubuntu-latest
        steps:
            - name: Remote deployment to Production
              uses: and-fm/cloudflared-ssh-action@v3
              with:
                  host: ${{ secrets.SERVER_SSH_HOST }}
                  port: 22
                  username: ${{ secrets.SERVER_SSH_USERNAME }}
                  private_key_filename: "deploy_key"
                  private_key_value: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
                  service_token_id: ${{ secrets.CF_ACCESS_CLIENT_ID }}
                  service_token_secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
                  commands: |
                      cd ~/production-calculator
                      git fetch --all
                      git checkout ${{ github.sha }}
                      export TAG=sha-${{ github.sha }}

                      docker network create calculator-prod-network || true

                      if [ "${{ github.ref }}" = "refs/heads/main" ]; then
                          docker compose -f "docker-compose.db.yml" -f "docker-compose.db.prod.yml" pull
                          docker compose -f "docker-compose.db.yml" -f "docker-compose.db.prod.yml" up -d
                      fi

                      docker compose -f "docker-compose.yml" -f "docker-compose.prod.yml" pull
                      docker compose -f "docker-compose.yml" -f "docker-compose.prod.yml" up -d
