name: production-calculator-dev

networks:
    shared-network:
        name: calculator-dev-network

services:
    backend:
        container_name: backend-dev
        ports:
            - 5141:5000
        environment:
            - ASPNETCORE_ENVIRONMENT=Development

    prometheus:
        container_name: prometheus-dev

    loki:
        container_name: loki-dev

    promtail:
        container_name: promtail-dev
        environment:
            - PROJECT_NAME=${COMPOSE_PROJECT_NAME:-production-calculator-dev}

    grafana:
        container_name: grafana-dev
        ports:
            - "5181:3000"
